<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSB CSBS Neopat Progress Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Right Live Clock Bar -->
  <div class="top-header">
    <div class="live-clock" id="liveClock">Loading Clock...</div>
  </div>

  <div class="container">
    <h2>VSB CSBS Neopat Tracker</h2>

    <!-- Live Analytics Bar -->
    <div class="analytics-card">
      <div class="analytics-header">
        <span><strong>Total Submitted Today:</strong> <span id="submittedCount">0</span> / <span id="totalCount">63</span></span>
        <span id="progressPercent" style="font-weight: bold; color: #38bdf8;">0%</span>
      </div>
      <div class="progress-bg">
        <div id="progressBar" class="progress-fill"></div>
      </div>
    </div>

    <!-- Student Details -->
    <div class="form-group">
      <label for="rollNoInput">Register Roll Number:</label>
      <input type="text" id="rollNoInput" placeholder="Ex: 922524244xxx" maxlength="12" oninput="handleRollInput()">
      <!-- Dynamic Hello Greeting Badge -->
      <div id="studentGreetingBadge" class="student-greeting-badge"></div>
    </div>

    <!-- Course Progress Section -->
    <div class="subject-grid">
      <!-- DBMS -->
      <div class="subject-box">
        <div class="subject-title">DBMS</div>
        <select id="dbmsStatus">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <input type="text" id="dbmsTopic" placeholder="Topic Name" style="margin-top: 6px;">
      </div>

      <!-- Java -->
      <div class="subject-box">
        <div class="subject-title">Java</div>
        <select id="javaStatus">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <input type="text" id="javaTopic" placeholder="Topic Name" style="margin-top: 6px;">
      </div>

      <!-- DSA -->
      <div class="subject-box">
        <div class="subject-title">DSA</div>
        <select id="dsaStatus">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <input type="text" id="dsaTopic" placeholder="Topic Name" style="margin-top: 6px;">
      </div>

      <!-- Aptitude -->
      <div class="subject-box">
        <div class="subject-title">Aptitude</div>
        <select id="aptiStatus">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <input type="text" id="aptiTopic" placeholder="Topic Name" style="margin-top: 6px;">
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitProgress()">Submit Today Progress</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
